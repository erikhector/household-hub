name: CI

# Runs on every PR, whichever branch it targets, and by hand from the
# Actions tab. Not on push: every commit reaching `next` or `master` came
# through a PR whose head already ran this, and the release workflow's own
# commits carry `[skip ci]`. This is the gate while AUTOPILOT.md says
# `ci_gate: github`.
#
# Two tiers, for the release train (REQUIREMENTS.md, "Releases & What's
# new"):
# - PRs into `next` (all feature work) run the fast job only: lint,
#   typecheck, unit tests and build. They merge without a browser run, so a
#   day of PRs doesn't spend one e2e run each, plus another every time a
#   branch is brought up to date.
# - PRs into `master` (the release PR from a `release/*` branch cut from
#   `next`, or a rare hotfix) also run the full Playwright suite, once, on
#   everything about to ship. The release branch is a snapshot, so merges
#   into `next` meanwhile don't restart it. A draft PR skips e2e until it's
#   marked ready.
# PRs that only touch docs (`*.md`, `docs/`, agent skills) skip both. A
# skipped job counts as passing for a required status check, so the
# rulesets need no change.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A new push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# This is a small, single-maintainer app — one job running the fast checks
# in sequence is simpler to read and debug than splitting them into
# parallel jobs.
jobs:
  changes:
    name: Decide what to run
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.decide.outputs.code }}
      e2e: ${{ steps.decide.outputs.e2e }}
    steps:
      - name: Look at the PR's base, draft state and files
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$BASE_REF" = "master" ] && [ "$DRAFT" != "true" ]; then e2e=true; else e2e=false; fi
          # Fails open: a file list it can't read runs everything.
          if ! files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename'); then
            echo "::warning::Couldn't list the PR's files, so every check runs."
            code=true
          elif printf '%s\n' "$files" | grep -qvE '(\.md$|^docs/|^\.claude/|^\.agents/)'; then
            code=true
          else
            code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "e2e=$e2e" >> "$GITHUB_OUTPUT"
          echo "App code changed: $code. Full e2e: $e2e."

  # The name stays "…, build" because the rulesets require it by name. On
  # a PR into `master` the build happens once, in the e2e job, instead.
  # The conditions compare against 'false' rather than test for 'true' so
  # that if `changes` itself fails (empty outputs) these still run: a
  # skipped job would count as a pass.
  ci:
    name: Lint, typecheck, test, build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Installs dependencies and runs `prisma generate` via the
      # package.json "postinstall" hook (no separate generate step needed).
      # This does NOT need DATABASE_URL: `prisma generate` only reads
      # prisma/schema.prisma to emit the typed client — it never opens a
      # database connection.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Next.js 16 generates global route-aware helper types (PageProps,
      # LayoutProps, RouteContext) into .next/types at build/dev time, and
      # tsconfig.json's "include" expects them there. Without this step,
      # `tsc --noEmit` fails on routes/layouts using those helpers even
      # though the project itself is fine. `next typegen` produces the same
      # .next/types output as `next build`/`next dev` without doing a full
      # build, so typecheck can run as its own fast, independent step before
      # the build step below.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      # `vitest run`. Every test that touches persistence mocks
      # "@/lib/prisma" (see src/lib/actions/household.test.ts and friends)
      # instead of hitting a real database, so no Postgres service container
      # is needed here — confirmed locally by running the full suite with no
      # DATABASE_URL set at all.
      - name: Test
        run: npm run test

      # `next build`. Verified locally that this succeeds with NO
      # DATABASE_URL / AUTH_SECRET set at all: every dashboard route reads
      # cookies()/auth() (src/lib/session.ts) and is therefore rendered
      # dynamically on request, not statically generated at build time, so
      # nothing during "Collecting page data" / "Generating static pages"
      # actually opens a database connection or reads the auth secret. If a
      # future change makes some route static and the build starts requiring
      # these vars, add clearly-fake placeholders here (e.g.
      # DATABASE_URL: postgresql://ci:ci@localhost:5432/ci and a 32+ char
      # dummy AUTH_SECRET) — never real secrets, since nothing at build time
      # actually connects with them.
      # Next.js reuses compiled output from `.next/cache` across builds
      # (the cache setup its docs recommend for GitHub Actions).
      - name: Restore Next.js build cache
        if: needs.changes.outputs.e2e == 'false'
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        if: needs.changes.outputs.e2e == 'false'
        run: npm run build

  # Catches a schema.prisma edit committed without its migration (or a
  # migration that no longer matches the schema), which `migrate deploy`
  # alone never notices: it only replays the SQL files. A dropped-column
  # migration that shipped without its schema change caused the PR #36
  # outage. Replays every migration on an empty Postgres, then asks Prisma
  # to diff that database against schema.prisma; `--exit-code` makes any
  # difference fail the job. (`--from-migrations` would need a shadow
  # database URL in prisma7.config.ts, which production doesn't use.) Its own job and not required by the rulesets,
  # so the required "Lint, typecheck, test, build" check is unchanged.
  migrations:
    name: Migration drift
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: household
          POSTGRES_PASSWORD: household
          POSTGRES_DB: household_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U household -d household_hub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://household:household@localhost:5432/household_hub
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate schema
        run: npx prisma validate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Check migrations match schema.prisma
        run: >-
          npx prisma migrate diff
          --from-config-datasource
          --to-schema prisma/schema.prisma
          --exit-code

  # Browser tests against a real Postgres and a production build (see
  # playwright.config.ts and e2e/). A separate job so the fast checks above
  # still report on their own when only this one fails. Only on PRs into
  # `master` (see the top of this file).
  e2e:
    name: End-to-end (Playwright)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: household
          POSTGRES_PASSWORD: household
          POSTGRES_DB: household_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U household -d household_hub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Clearly-fake, CI-only values: the database is the throwaway service
      # container above and the secret signs nothing that outlives the job.
      DATABASE_URL: postgresql://household:household@localhost:5432/household_hub
      AUTH_SECRET: ci-only-e2e-secret-not-used-anywhere-real
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browsers are ~400 MB; cached per lockfile (which pins the
      # Playwright version). The OS packages they need aren't in the cache,
      # so a hit still installs those.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Run end-to-end tests
        # E2E_WEBKIT adds the `iphone` WebKit project (UX-32).
        env:
          E2E_WEBKIT: "1"
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
