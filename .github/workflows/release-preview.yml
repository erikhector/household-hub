name: Release preview

# Runs on every PR into `next` or `master`. Validates the PR title
# (Conventional Commits), then posts or updates one comment showing the
# user-facing note that will appear under "What's new": for a feature PR
# into `next`, the bump it adds to the next release; for a hotfix into
# `master`, the version it releases on merge. The release PR (a
# `release/*` branch cut from `next`, into `master`) instead lists every PR it ships with the version and the
# combined note, and its own title isn't checked (it doesn't decide the
# bump; the included PRs' titles do).
# A releasing PR (feat/fix/perf) also fails until its Release note is
# written in both English and Svenska, so English never ships to Swedish
# users. Make the "Release preview" check required in the branch ruleset
# (see DEPLOYMENT.md) so such a PR can't be merged.
#
# Nothing is written to the branch here. The bump happens after merge
# (release.yml), because bumping inside each PR would make every two open
# PRs conflict on package.json's version line.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [master, next]

permissions:
  contents: read
  pull-requests: write

# A burst of description edits only needs the last one previewed.
concurrency:
  group: release-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Release preview
    runs-on: ubuntu-latest
    steps:
      # Full history so the release PR's range (master..release branch) can be read.
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Node 22.18+ runs scripts/release.ts directly (built-in type
      # stripping), so no `npm ci` is needed.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # PR title and body go through env vars and are never interpolated
      # into the script, so a crafted title can't inject shell commands.
      # Same collection as release.yml, over what the PR would bring in.
      - name: Collect the release train's PRs
        id: train
        if: github.event.pull_request.base.ref == 'master' && startsWith(github.event.pull_request.head.ref, 'release/')
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          prs=$(node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/release.ts train-prs "origin/master..$HEAD_SHA")
          for n in $prs; do gh pr view "$n" --json number,title,body; done | jq -s . > "$RUNNER_TEMP/train-prs.json"
          echo "file=$RUNNER_TEMP/train-prs.json" >> "$GITHUB_OUTPUT"

      - name: Plan release
        id: plan
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          TRAIN_PRS_FILE: ${{ steps.train.outputs.file }}
        run: |
          set +e
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/release.ts preview > "$RUNNER_TEMP/preview.md"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat "$RUNNER_TEMP/preview.md" >> "$GITHUB_STEP_SUMMARY"

      # Edits the existing preview comment (found by its hidden marker) so
      # the PR has one preview comment, not a new one per push.
      - name: Post preview comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          comment_id=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- release-preview -->")) | .id' | head -n 1)
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$comment_id" -F body=@"$RUNNER_TEMP/preview.md" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR_NUMBER/comments" -F body=@"$RUNNER_TEMP/preview.md" > /dev/null
          fi

      - name: Fail on invalid PR title or missing release note
        if: steps.plan.outputs.exit_code != '0'
        run: |
          echo "::error::PR title must be a Conventional Commit, e.g. 'feat(shopping): barcode scan', and a feat/fix/perf PR needs its release note in English and Svenska. See the preview comment."
          exit 1
