name: Nightly e2e

# The whole Playwright suite, every project including `iphone` (WebKit),
# on `next` once a night. The release PR's e2e gate (ci.yml) runs the
# suite in three shards without WebKit to keep releases quick; this run
# is where WebKit-only regressions show up, within a day of merging. A
# failure here is read by the autopilot reviewer before it cuts the next
# release (.claude/skills/autopilot-review/SKILL.md) and, like any failed
# scheduled run, emailed by GitHub to whoever last changed the cron line.
#
# Scheduled workflows run on the default branch (`next`), which is what
# the next release will ship. 02:17 UTC: off the hour, and between the
# autopilot's busier daytime runs.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

# Per ref, so a run dispatched on a release branch (autopilot-review)
# doesn't cancel the scheduled one on `next`.
concurrency:
  group: e2e-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: End-to-end, all projects
    runs-on: ubuntu-latest
    # The single-runner suite took 32 minutes in November 2026; leave room
    # for it to grow without letting a hung run eat six hours of minutes.
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: household
          POSTGRES_PASSWORD: household
          POSTGRES_DB: household_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U household -d household_hub"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Clearly-fake, CI-only values, as in ci.yml's e2e job.
      DATABASE_URL: postgresql://household:household@localhost:5432/household_hub
      AUTH_SECRET: ci-only-e2e-secret-not-used-anywhere-real
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Its own cache key: ci.yml's shards cache Chromium alone.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      - name: Apply migrations
        run: npx prisma migrate deploy

      # Same key as ci.yml's shards. A release PR's run can only restore
      # caches saved on `next` (the default branch) or `master`, and ci.yml
      # never runs on a push to either, so the cache this run saves on
      # `next` is what warms the release shards' builds.
      - name: Restore Next.js build cache
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Run end-to-end tests
        # E2E_WEBKIT adds the `iphone` WebKit project (UX-32).
        env:
          E2E_WEBKIT: "1"
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
