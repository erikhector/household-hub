services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: household
      POSTGRES_PASSWORD: household
      POSTGRES_DB: household_hub
    ports:
      - "5432:5432"
    volumes:
      - household-hub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U household -d household_hub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  household-hub-postgres:
